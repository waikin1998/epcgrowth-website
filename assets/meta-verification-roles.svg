<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><rect width="1200" height="620" rx="28" fill="#edf4ff"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="65" fill="#0960ed" font-size="19" font-weight="700" letter-spacing="2">EPC MARKETING · META ADS GUIDE</text><text x="64" y="128" font-size="34" font-weight="700" fill="#15263e">Understand the three roles first</text><text x="64" y="170" font-size="22" fill="#61718a">Beneficiary, payer and operator may be different entities.</text><rect x="64" y="220" width="344" height="310" rx="20" fill="white" stroke="#d3e2fa"/><circle cx="112" cy="269" r="24" fill="#0960ed"/><text x="105" y="277" font-size="23" font-weight="700" fill="white">1</text><text x="90" y="337" font-size="30" fill="#15263e">Beneficiary</text><text x="90" y="374" font-size="18" fill="#0960ed">Beneficiary</text><text x="90" y="422" font-size="19" fill="#53647c">Who is being promoted?</text><text x="90" y="458" font-size="19" fill="#53647c">Example: a beauty business</text><text x="90" y="494" font-size="19" fill="#53647c">providing the advertised service</text><rect x="427" y="220" width="344" height="310" rx="20" fill="white" stroke="#d3e2fa"/><circle cx="475" cy="269" r="24" fill="#0960ed"/><text x="468" y="277" font-size="23" font-weight="700" fill="white">2</text><text x="453" y="337" font-size="30" fill="#15263e">Payer</text><text x="453" y="374" font-size="18" fill="#0960ed">Payer / Payor</text><text x="453" y="422" font-size="19" fill="#53647c">Who pays for the ads?</text><text x="453" y="458" font-size="19" fill="#53647c">Check the actual payment</text><text x="453" y="494" font-size="19" fill="#53647c">arrangement and task guidance</text><rect x="790" y="220" width="344" height="310" rx="20" fill="white" stroke="#d3e2fa"/><circle cx="838" cy="269" r="24" fill="#0960ed"/><text x="831" y="277" font-size="23" font-weight="700" fill="white">3</text><text x="816" y="337" font-size="30" fill="#15263e">Operator</text><text x="816" y="374" font-size="18" fill="#0960ed">Advertiser / agency</text><text x="816" y="422" font-size="19" fill="#53647c">Who manages the campaign?</text><text x="816" y="458" font-size="19" fill="#53647c">An employee or agency may</text><text x="816" y="494" font-size="19" fill="#53647c">manage ads without benefiting</text><text x="64" y="590" fill="#6b7c95" font-size="17">Original illustration, not a Meta screenshot. Follow your account instructions.</text></g></svg>