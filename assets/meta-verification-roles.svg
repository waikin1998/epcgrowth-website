<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><rect width="1200" height="620" rx="28" fill="#edf4ff"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="65" fill="#0960ed" font-size="19" font-weight="700" letter-spacing="2">EPC MARKETING · META ADS GUIDE</text><text x="64" y="128" font-size="38" font-weight="700" fill="#15263e">先分清三个角色，再填写验证资料</text><text x="64" y="170" font-size="22" fill="#61718a">受益人、付款方、操作人员，可能是不同主体。</text><rect x="64" y="220" width="344" height="310" rx="20" fill="white" stroke="#d3e2fa"/><circle cx="112" cy="269" r="24" fill="#0960ed"/><text x="105" y="277" font-size="23" font-weight="700" fill="white">1</text><text x="90" y="337" font-size="30" fill="#15263e">受益人</text><text x="90" y="374" font-size="18" fill="#0960ed">Beneficiary</text><text x="90" y="422" font-size="21" fill="#53647c">广告在宣传谁？</text><text x="90" y="458" font-size="21" fill="#53647c">例如：推广美容店服务</text><text x="90" y="494" font-size="21" fill="#53647c">对应实际提供服务的商家</text><rect x="427" y="220" width="344" height="310" rx="20" fill="white" stroke="#d3e2fa"/><circle cx="475" cy="269" r="24" fill="#0960ed"/><text x="468" y="277" font-size="23" font-weight="700" fill="white">2</text><text x="453" y="337" font-size="30" fill="#15263e">付款方</text><text x="453" y="374" font-size="18" fill="#0960ed">Payer / Payor</text><text x="453" y="422" font-size="21" fill="#53647c">谁支付广告费用？</text><text x="453" y="458" font-size="21" fill="#53647c">根据实际付款与代垫安排</text><text x="453" y="494" font-size="21" fill="#53647c">对照当前验证流程确认</text><rect x="790" y="220" width="344" height="310" rx="20" fill="white" stroke="#d3e2fa"/><circle cx="838" cy="269" r="24" fill="#0960ed"/><text x="831" y="277" font-size="23" font-weight="700" fill="white">3</text><text x="816" y="337" font-size="30" fill="#15263e">操作人员</text><text x="816" y="374" font-size="18" fill="#0960ed">Advertiser / agency</text><text x="816" y="422" font-size="21" fill="#53647c">谁管理广告？</text><text x="816" y="458" font-size="21" fill="#53647c">员工或代理商可以代操作</text><text x="816" y="494" font-size="21" fill="#53647c">不因此自动成为受益人</text><text x="64" y="590" fill="#6b7c95" font-size="17">原创说明图 · 非 Meta 后台截图 · 具体要求以账户通知为准</text></g></svg>