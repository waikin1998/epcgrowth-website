<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><rect width="1200" height="680" rx="28" fill="#edf4ff"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="65" fill="#0960ed" font-size="19" font-weight="700" letter-spacing="2">EPC MARKETING · META ADS GUIDE</text><text x="64" y="128" font-size="34" font-weight="700" fill="#15263e">Six steps after a verification request</text><text x="64" y="170" font-size="22" fill="#61718a">Identify the task, then follow your own account’s process.</text><rect x="64" y="215" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="87" y="257" fill="#0960ed" font-size="24" font-weight="700">01</text><text x="140" y="257" font-size="26" fill="#15263e">Official entry</text><text x="87" y="306" font-size="18" fill="#53647c">Check Ads Manager or</text><text x="87" y="342" font-size="18" fill="#53647c">Business Suite for the notice</text><rect x="427" y="215" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="450" y="257" fill="#0960ed" font-size="24" font-weight="700">02</text><text x="503" y="257" font-size="26" fill="#15263e">Check assets</text><text x="450" y="306" font-size="18" fill="#53647c">Confirm the ad account, Page</text><text x="450" y="342" font-size="18" fill="#53647c">and targeting locations</text><rect x="790" y="215" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="813" y="257" fill="#0960ed" font-size="24" font-weight="700">03</text><text x="866" y="257" font-size="26" fill="#15263e">Read the task</text><text x="813" y="306" font-size="18" fill="#53647c">Identify the verification type</text><text x="813" y="342" font-size="18" fill="#53647c">Check the stated deadline</text><rect x="64" y="405" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="87" y="447" fill="#0960ed" font-size="24" font-weight="700">04</text><text x="140" y="447" font-size="26" fill="#15263e">Select entities</text><text x="87" y="496" font-size="18" fill="#53647c">Use real business and</text><text x="87" y="532" font-size="18" fill="#53647c">payment relationships</text><rect x="427" y="405" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="450" y="447" fill="#0960ed" font-size="24" font-weight="700">05</text><text x="503" y="447" font-size="26" fill="#15263e">Submit evidence</text><text x="450" y="496" font-size="18" fill="#53647c">Follow the official checklist</text><text x="450" y="532" font-size="18" fill="#53647c">Check names and addresses</text><rect x="790" y="405" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="813" y="447" fill="#0960ed" font-size="24" font-weight="700">06</text><text x="866" y="447" font-size="26" fill="#15263e">Review status</text><text x="813" y="496" font-size="18" fill="#53647c">Check verification, ad review</text><text x="813" y="532" font-size="18" fill="#53647c">and ad-set entity selection</text><text x="64" y="650" fill="#6b7c95" font-size="17">Original illustration, not a Meta screenshot. Follow your account instructions.</text></g></svg>