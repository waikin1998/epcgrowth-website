dth="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="450" y="447" fill="#0960ed" font-size="24" font-weight="700">05</text><text x="503" y="447" font-size="26" fill="#15263e">提交资料</text><text x="450" y="496" font-size="20" fill="#53647c">只按官方清单上传</text><text x="450" y="532" font-size="20" fill="#53647c">检查名称、地址一致</text><rect x="790" y="405" width="344" height="164" rx="18" fill="white" stroke="#d3e2fa"/><text x="813" y="447" fill="#0960ed" font-size="24" font-weight="700">06</text><text x="866" y="447" font-size="26" fill="#15263e">检查状态</text><text x="813" y="496" font-size="20" fill="#53647c">核对验证、广告审核</text><text x="813" y="532" font-size="20" fill="#53647c">及广告组主体设置</text><text x="64" y="650" fill="#6b7c95" font-size="17">原创说明图 · 非 Meta 后台截图 · 具体要求以账户通知为准</text></g></svg>